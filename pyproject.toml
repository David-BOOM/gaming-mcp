[project]
name = "gaming-mcp"
version = "0.1.0"
description = "MCP server enabling LLM agents to observe and control video games"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "David", email = "placeholder@example.com" },
]
keywords = ["mcp", "gaming", "llm", "agent", "computer-use", "minecraft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.7.0",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "mss>=9.0.1",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
gamepad = ["vgamepad>=0.1.0"]
audio = ["sounddevice>=0.5.0", "scipy>=1.13.0"]
ocr = ["easyocr>=1.7.0"]
minecraft = ["aiohttp>=3.9.0"]
retro = ["gymnasium>=0.29.0", "stable-retro>=0.9.0"]
turbo = ["PyTurboJPEG>=1.7.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
all = [
    "vgamepad>=0.1.0",
    "sounddevice>=0.5.0",
    "scipy>=1.13.0",
    "easyocr>=1.7.0",
    "aiohttp>=3.9.0",
    "gymnasium>=0.29.0",
    "stable-retro>=0.9.0",
    "PyTurboJPEG>=1.7.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
gaming-mcp = "gaming_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaming_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
